<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kastave | Scan Before You Cast</title>
    <meta
      name="description"
      content="Kastave is a shoreline fishing scout that scans the water, shows the 3D bottom, and helps you pick your first cast."
    />
    <link rel="canonical" href="https://kastave.com/" />
    <meta name="theme-color" content="#d95b00" />
    <meta property="og:title" content="Kastave | Scan Before You Cast" />
    <meta
      property="og:description"
      content="Scan the water before you cast. Coming soon on Kickstarter with a $1 founder reservation and $100 launch credit."
    />
    <meta property="og:url" content="https://kastave.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://kastave.com/kastave-hero.jpg" />
    <meta property="og:image:alt" content="Kastave shoreline fishing scout scanning reachable water before the first cast." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kastave | Scan Before You Cast" />
    <meta
      name="twitter:description"
      content="A shoreline fishing scout that scans reachable water, shows the 3D bottom, and helps pick your first cast."
    />
    <meta name="twitter:image" content="https://kastave.com/kastave-hero.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <img
        height="1"
        width="1"
        style="display:none"
        src="https://www.facebook.com/tr?id=1542765323857764&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>
    <script>
      (() => {
        const paypalLink = "https://www.paypal.com/ncp/payment/6W9PTBNB267ZW";
        const attributionKeys = [
          "fbclid",
          "gclid",
          "utm_source",
          "utm_medium",
          "utm_campaign",
          "utm_content",
          "utm_term",
        ];

        function getStoredAttribution() {
          try {
            return JSON.parse(localStorage.getItem("kastave_utm") || "{}");
          } catch {
            return {};
          }
        }

        function buildPaymentUrl() {
          const target = new URL(paypalLink);
          const attribution = getStoredAttribution();
          const currentParams = new URLSearchParams(window.location.search);

          currentParams.forEach((value, key) => {
            if (key.startsWith("utm_") || attributionKeys.includes(key)) {
              attribution[key] = value;
            }
          });

          Object.entries(attribution).forEach(([key, value]) => {
            if (value && !target.searchParams.has(key)) {
              target.searchParams.set(key, value);
            }
          });

          return target.toString();
        }

        function trackReserveClick(button) {
          const source = button.classList.contains("nav-reserve-button") ? "nav" : "hero";
          const payload = {
            amount_cents: 100,
            content_name: "Kastave $1 early reservation",
            currency: "USD",
            provider: "paypal",
            source,
            value: 1,
          };

          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ event: "initiate_checkout", ...payload });

          if (window.fbq) {
            window.fbq("track", "InitiateCheckout", payload);
          }
        }

        document.addEventListener(
          "click",
          (event) => {
            const target = event.target instanceof Element ? event.target : event.target?.parentElement;
            const cta = target?.closest("button, a");

            if (!cta || cta.textContent.replace(/\s+/g, " ").trim() !== "Reserve for $1") {
              return;
            }

            event.preventDefault();
            event.stopImmediatePropagation();
            trackReserveClick(cta);
            window.location.assign(buildPaymentUrl());
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
